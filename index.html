<!doctype html>
<html lang="ja">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-72VSSQLHS0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', 'G-72VSSQLHS0');
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd928">
    <meta name="description" content="あなたの仕事、AIに何%任せられる？チップ商会のネタ診断。">
    <title>あなたの仕事、AIに何%任せられる？ | チップ商会</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/site-config.js" defer></script>
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="app-frame" aria-live="polite">
      <section class="screen screen--top is-active" id="screen-top" aria-labelledby="top-title">
        <div class="burst burst--top" aria-hidden="true"></div>
        <div class="screen-content top-content">
          <div class="speech speech--hero">
            <h1 id="top-title">あなたの仕事、<br>AIに何%<br>任せられる？</h1>
          </div>
          <img class="character character--top" src="assets/chip_surprised.svg" alt="びっくりしたチップくん">
          <div class="top-actions">
            <button class="button button--start" type="button" data-go="jobs">診断スタート <span aria-hidden="true">▶</span></button>
            <p class="duration">全15問・約3分</p>
          </div>
        </div>
        <p class="brand"><span class="brand-chip" aria-hidden="true">▦</span> チップ商会</p>
      </section>

      <section class="screen screen--jobs" id="screen-jobs" aria-labelledby="jobs-title" hidden>
        <div class="screen-content">
          <header class="screen-header">
            <div class="speech speech--header"><h1 id="jobs-title">まずはあなたの<br>職種を教えて</h1></div>
          </header>
          <div class="job-grid" id="job-list" aria-label="職種を選択"></div>
          <p class="brand brand--bottom"><span class="brand-chip" aria-hidden="true">▦</span> チップ商会</p>
        </div>
      </section>

      <section class="screen screen--question" id="screen-question" aria-labelledby="question-title" hidden>
        <div class="screen-content question-content">
          <div class="progress-wrap">
            <span class="progress-label">質問</span>
            <div class="progress-track" id="question-progress" role="progressbar" aria-label="診断の進捗" aria-valuemin="0" aria-valuemax="15" aria-valuenow="1"><span class="progress-fill" id="progress-fill"></span></div>
            <span class="progress-count"><span id="question-number">1</span> <i>/ 15</i></span>
            <img class="character character--thinking" src="assets/chip_thinking.svg" alt="考えるチップくん">
          </div>
          <div class="question-panel">
            <p class="question-kicker">QUESTION <span>01</span></p>
            <h1 id="question-title"></h1>
            <span class="panel-star panel-star--one" aria-hidden="true">✦</span>
            <span class="panel-star panel-star--two" aria-hidden="true">✦</span>
          </div>
          <div class="answer-list" id="answer-list" aria-label="回答を選択"></div>
          <button class="button button--back" id="back-question" type="button"><span aria-hidden="true">←</span> ひとつ戻る</button>
          <p class="brand"><span class="brand-chip" aria-hidden="true">▦</span> チップ商会</p>
        </div>
      </section>

      <section class="screen screen--result" id="screen-result" aria-labelledby="result-title" hidden>
        <div class="screen-content result-content">
          <p class="result-intro" id="result-title">あなたの仕事、<br>AIに任せられるのは…</p>
          <div class="result-number" id="result-percentage" aria-label="結果を計算中"><span>0</span><small>%</small></div>
          <div class="speech speech--result" id="result-type-bubble"><h1 id="result-type-title"></h1></div>
          <img class="character character--happy" src="assets/chip_happy.svg" alt="うれしそうなチップくん">
          <div class="result-card result-card--type">
            <p class="card-eyebrow">診断タイプ</p>
            <p class="card-lead" id="result-type-message"></p>
          </div>
          <div class="result-card result-card--job">
            <p class="job-message" id="job-message"></p>
          </div>
          <p class="disclaimer">この診断はネタです。科学的な根拠はありません。</p>
          <div class="share-actions" aria-label="診断結果をシェア">
            <button class="share-button" type="button" data-share-platform="x"><span class="share-icon share-icon--x" aria-hidden="true">𝕏</span><span>X</span></button>
            <button class="share-button" type="button" data-share-platform="line"><svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.8 3 2.5 6.4 2.5 10.6c0 2.3 1.4 4.4 3.6 5.7l-.8 3.1 3.5-1.8c1 .3 2.1.5 3.2.5 5.2 0 9.5-3.4 9.5-7.6S17.2 3 12 3Zm-4.4 9.1V8.7h1v3.4h1.8v.9H7.6Zm3.5 0V8.7h1v4.3h-1Zm2.4 0V8.7h.9l2 2.7V8.7h1v4.3h-.9l-2-2.7v2.7h-1Z"/></svg><span>LINE</span></button>
            <button class="share-button" type="button" data-share-platform="threads"><span class="share-icon share-icon--threads" aria-hidden="true">@</span><span>Threads</span></button>
            <button class="share-button" type="button" data-share-platform="facebook"><span class="share-icon share-icon--facebook" aria-hidden="true">f</span><span>Facebook</span></button>
            <button class="share-button share-button--copy" type="button" data-share-platform="copy_link"><svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 12.8 6.9 14.4a3.2 3.2 0 0 0 4.5 4.5l3.1-3.1a3.2 3.2 0 0 0 0-4.5l-.7-.7-1.3 1.3.7.7a1.4 1.4 0 0 1 0 1.9l-3.1 3.1a1.4 1.4 0 0 1-1.9-1.9l1.6-1.6-1.3-1.3Zm7-1.6 1.6-1.6a3.2 3.2 0 1 0-4.5-4.5L9.5 8.2a3.2 3.2 0 0 0 0 4.5l.7.7 1.3-1.3-.7-.7a1.4 1.4 0 0 1 0-1.9l3.1-3.1a1.4 1.4 0 0 1 1.9 1.9l-1.6 1.6 1.3 1.3ZM8.2 14.1l7.1-7.1 1.3 1.3-7.1 7.1-1.3-1.3Z"/></svg><span>リンクをコピー</span></button>
          </div>
          <p class="copy-feedback" id="copy-feedback" role="status" aria-live="polite"></p>
          <p class="privacy-note">診断結果は匿名で集計しています</p>
          <button class="button button--again" type="button" data-go="top">もう一度診断 <span aria-hidden="true">↻</span></button>
          <p class="brand"><span class="brand-chip" aria-hidden="true">▦</span> チップ商会</p>
        </div>
      </section>
    </main>
  </body>
</html>
